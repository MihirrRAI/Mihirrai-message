  }
  .hero-scrim {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.75) 55%, rgba(0,0,0,0.94) 100%),
      linear-gradient(to top, #000 0%, rgba(0,0,0,0.2) 35%, rgba(0,0,0,0.55) 100%);
  }

  .particle { position: absolute; border-radius: 9999px; will-change: transform; }
  @keyframes pulse-slow {
    0%, 100% { opacity: .4; }
    50% { opacity: .15; }
  }
  .animate-pulse { animation: pulse-slow 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .animate-pulse { animation: none; }
  }

  /* Thunder effect */
  #thunder-flash {
    background: radial-gradient(120% 100% at 50% 35%, rgba(255,80,60,0.9) 0%, rgba(180,10,20,0.55) 35%, rgba(0,0,0,0) 70%);
    transition: opacity 60ms linear;
  }
  #thunder-flash.flash-active { opacity: 1; }

  .bolt-path {
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px #ff3b30) drop-shadow(0 0 16px #ff0000) drop-shadow(0 0 28px rgba(255,0,0,0.8));
    opacity: 0;
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
  }
  .bolt-path.bolt-strike {
    animation: bolt-draw 260ms ease-out forwards, bolt-fade 420ms ease-in 220ms forwards;
  }
  @keyframes bolt-draw {
    0%   { stroke-dashoffset: 1400; opacity: 0; }
    8%   { opacity: 1; }
    60%  { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  @keyframes bolt-fade {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes hero-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(5px, -4px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(3px, -2px); }
  }
  .hero-shake { animation: hero-shake 380ms ease-in-out; }

  @media (prefers-reduced-motion: reduce) {
    .hero-shake { animation: none; }
    .bolt-path.bolt-strike { animation: bolt-fade 300ms ease-in forwards; stroke-dashoffset: 0; opacity: .9; }
  }

  /* 3D box loader */
  #loader-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
  }
  #loader-overlay.loader-visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Reveal page */
  #reveal-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 500ms ease;
  }
  #reveal-overlay.reveal-visible {
    opacity: 1;
    pointer-events: auto;
  }
  #reveal-back-btn {
    position: absolute;
    top: 1.25rem;
    left: 1.25rem;
    z-index: 80;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 9999px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease, transform 150ms ease;
  }
  #reveal-back-btn:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
    transform: translateY(-1px);
  }
  #confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #reveal-content {
    position: relative;
    z-index: 2;
    max-width: min(92vw, 480px);
    max-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.85);
    opacity: 0;
    transition: transform 550ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 450ms ease;
  }
  #reveal-overlay.reveal-visible #reveal-content {
    transform: scale(1);
    opacity: 1;
  }
  #reveal-image {
    max-width: 100%;
    max-height: 88vh;
    border-radius: 1rem;
    box-shadow: 0 10px 60px rgba(255, 60, 60, 0.35), 0 0 0 1px rgba(255,255,255,0.06);
    display: block;
  }

  .loader {
    --duration: 3s;
    --primary: rgba(220, 38, 38, 1);
    --primary-light: #7f1d1d;
    --primary-rgba: rgba(220, 38, 38, 0);
    width: 200px;
    height: 320px;
    position: relative;
    transform-style: preserve-3d;
    transform: scale(0.5);
  }
  @media (max-width: 480px) {
    .loader { transform: scale(0.32); }
  }
  .loader:before, .loader:after {
    --r: 20.5deg;
    content: "";
    width: 320px;
    height: 140px;
    position: absolute;
    right: 32%;
    bottom: -11px;
    background: #000;
    transform: translateZ(200px) rotate(var(--r));
    animation: mask var(--duration) linear forwards infinite;
  }
  .loader:after {
    --r: -20.5deg;
    right: auto;
    left: 32%;
  }
  .loader .ground {
    position: absolute;
    left: -50px;
    bottom: -120px;

<script>
(function () {
  const rows = window.innerWidth < 480 ? 8 : 10; // fewer particles on small phones
  const totalParticles = rows * rows;
  const container = document.getElementById('particle-container');
  container.style.width = `calc(var(--particle-unit) * ${rows})`;
  container.style.height = `calc(var(--particle-unit) * ${rows})`;

  const particles = [];
  for (let i = 0; i < totalParticles; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';

    const row = Math.floor(i / rows);
    const col = i % rows;
    const centerRow = Math.floor(rows / 2);
    const centerCol = Math.floor(rows / 2);
    const distanceFromCenter = Math.sqrt((row - centerRow) ** 2 + (col - centerCol) ** 2);

    const scale = Math.max(0.1, 1.2 - distanceFromCenter * 0.12);
    const opacity = Math.max(0.05, 1 - distanceFromCenter * 0.1);
    const lightness = Math.max(15, 75 - distanceFromCenter * 6);
    const glowSize = Math.max(0.5, 6 - distanceFromCenter * 0.5);

    particle.style.cssText = `
      width: calc(var(--particle-unit) * 0.42);
      height: calc(var(--particle-unit) * 0.42);
      left: calc(var(--particle-unit) * ${col});
      top: calc(var(--particle-unit) * ${row});
      transform: scale(${scale});
      opacity: ${opacity};
      background: hsl(4, 85%, ${lightness}%);
      box-shadow: 0 0 ${glowSize * 0.4}rem 0 hsl(4, 85%, 60%);
      mix-blend-mode: screen;
      z-index: ${Math.round(totalParticles - distanceFromCenter * 5)};
      transition: transform 0.05s linear;
    `;

    container.appendChild(particle);
    particles.push({ el: particle, row, col, centerRow, centerCol, distanceFromCenter, scale });
  }

  let cursor = { x: 0, y: 0 };
  let staticCursor = { x: 0, y: 0 };
  let isAutoMode = true;
  let isStaticAnimation = false;
  const startTime = Date.now();
  let lastMouseMove = Date.now();
  let idleTimeout;

  function updateParticles() {
    particles.forEach((p) => {
      const delay = p.distanceFromCenter * 8;
      const dampening = Math.max(0.3, 1 - p.distanceFromCenter * 0.08);
      setTimeout(() => {
        const moveX = cursor.x * dampening;
        const moveY = cursor.y * dampening;
        p.el.style.transform = `translate(${moveX}px, ${moveY}px) scale(${p.scale})`;
        p.el.style.transition = `transform ${120 + p.distanceFromCenter * 20}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
      }, delay);
    });
  }

  function animate() {
    const t = (Date.now() - startTime) * 0.001;

    if (isAutoMode) {
      cursor = {
        x: Math.sin(t * 0.3) * 200 + Math.sin(t * 0.17) * 100,
        y: Math.cos(t * 0.2) * 150 + Math.cos(t * 0.23) * 80
      };
      updateParticles();
    } else if (isStaticAnimation) {
      const since = Date.now() - lastMouseMove;
      if (since > 200) {
        const strength = Math.min((since - 200) / 1000, 1);
        cursor = {
          x: staticCursor.x + Math.sin(t * 1.5) * 20 * strength,
          y: staticCursor.y + Math.cos(t * 1.2) * 16 * strength
        };
        updateParticles();
      }
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function handlePointerMove(e) {
    const evt = e.touches ? e.touches[0] : e;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    cursor = { x: (evt.clientX - centerX) * 0.8, y: (evt.clientY - centerY) * 0.8 };
    staticCursor = { ...cursor };
    isAutoMode = false;
    isStaticAnimation = false;
    lastMouseMove = Date.now();
    updateParticles();

    clearTimeout(idleTimeout);
    idleTimeout = setTimeout(() => { isStaticAnimation = true; }, 500);

    setTimeout(() => {
      if (Date.now() - lastMouseMove >= 4000) {
        isAutoMode = true;
        isStaticAnimation = false;
      }
    }, 4000);
  }

  const hero = document.getElementById('hero');
  hero.addEventListener('mousemove', handlePointerMove);
  hero.addEventListener('touchmove', handlePointerMove, { passive: true });

  // --- Thunder / lightning effect on Open click ---
  const openBtn = document.getElementById('open-btn');
  const flashEl = document.getElementById('thunder-flash');
  const boltsSvg = document.getElementById('thunder-bolts');

  function jaggedPath(x0, y0, x1, y1, segments, jitter) {
    let d = `M ${x0} ${y0}`;
    let px = x0, py = y0;
    for (let i = 1; i <= segments; i++) {
      const t = i / segments;
      const targetX = x0 + (x1 - x0) * t;
      const targetY = y0 + (y1 - y0) * t;
      const nx = targetX + (Math.random() - 0.5) * jitter;
      const ny = targetY + (Math.random() - 0.5) * jitter;
      d += ` L ${nx.toFixed(1)} ${ny.toFixed(1)}`;
      px = nx; py = ny;
    }
    d += ` L ${x1} ${y1}`;
    return d;
  }

  function spawnBolt(x0, y0, x1, y1, opts = {}) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', jaggedPath(x0, y0, x1, y1, opts.segments || 9, opts.jitter || 45));
    path.setAttribute('class', 'bolt-path');
    path.style.strokeWidth = opts.width || 3;
    boltsSvg.appendChild(path);

    requestAnimationFrame(() => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.classList.add('bolt-strike');
    });

    setTimeout(() => path.remove(), 700);

    // occasional branch fork
    if (opts.branch !== false && Math.random() > 0.4) {
      const midT = 0.35 + Math.random() * 0.3;
      const mx = x0 + (x1 - x0) * midT;
      const my = y0 + (y1 - y0) * midT;
      const bx = mx + (Math.random() - 0.5) * 260;
      const by = my + 120 + Math.random() * 140;
      setTimeout(() => spawnBolt(mx, my, bx, by, { segments: 5, jitter: 30, width: 1.6, branch: false }), 40);
    }
  }

  function triggerThunder() {
    hero.classList.remove('hero-shake');
    void hero.offsetWidth; // restart animation
    hero.classList.add('hero-shake');

    // double-flash like a real strike
    flashEl.classList.add('flash-active');
    setTimeout(() => flashEl.classList.remove('flash-active'), 90);
    setTimeout(() => flashEl.classList.add('flash-active'), 160);
    setTimeout(() => flashEl.classList.remove('flash-active'), 260);

    const w = hero.clientWidth;
    const h = hero.clientHeight;
    boltsSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    boltsSvg.innerHTML = '';

    const boltCount = w < 640 ? 2 : 3;
    for (let i = 0; i < boltCount; i++) {
      const startX = w * 0.15 + Math.random() * w * 0.7;
      spawnBolt(startX, -20, startX + (Math.random() - 0.5) * w * 0.25, h * 0.45 + Math.random() * h * 0.35, {
        segments: 10,
        jitter: Math.max(30, w * 0.045),
        width: 2.5 + Math.random() * 1.5
      });
    }
  }

  openBtn.addEventListener('click', () => {
    triggerThunder();
    setTimeout(() => showLoader(6000), 350);
  });

  const loaderOverlay = document.getElementById('loader-overlay');
  let loaderHideTimeout;
  function showLoader(durationMs) {
    clearTimeout(loaderHideTimeout);
    loaderOverlay.classList.add('loader-visible');
    loaderHideTimeout = setTimeout(() => {
      loaderOverlay.classList.remove('loader-visible');
      showReveal();
    }, durationMs);
  }

  /* ---- Reveal page + confetti ---- */
  const revealOverlay = document.getElementById('reveal-overlay');
  const revealBackBtn = document.getElementById('reveal-back-btn');
  if (revealBackBtn) {
    revealBackBtn.addEventListener('click', () => {
      revealOverlay.classList.remove('reveal-visible');
      loaderOverlay.classList.remove('loader-visible');
      clearTimeout(loaderHideTimeout);
      if (confettiRAF) {
        cancelAnimationFrame(confettiRAF);
        confettiRAF = null;
      }
      confettiPieces = [];
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
    });
  }
  const confettiCanvas = document.getElementById('confetti-canvas');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  let confettiRAF = null;

  function resizeConfettiCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfettiCanvas);

  const confettiColors = ['#ff4d6d', '#ff8fa3', '#ffd166', '#ef476f', '#ffffff', '#ff2e63', '#ffc4dd'];

  function spawnConfetti(count) {
    resizeConfettiCanvas();
    const w = confettiCanvas.width;
    const pieces = [];
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * w,
        y: -20 - Math.random() * 200,
        size: 6 + Math.random() * 8,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        speedY: 2 + Math.random() * 3,
        speedX: (Math.random() - 0.5) * 2.2,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 10,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
        life: 0,
        maxLife: 260 + Math.random() * 120
      });
    }
    return pieces;
  }

  function drawConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiPieces.forEach(p => {
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rotation * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
      if (p.shape === 'rect') {
        confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        confettiCtx.beginPath();
        confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        confettiCtx.fill();
      }
      confettiCtx.restore();
    });
  }

  function stepConfetti() {
    confettiPieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.speedY += 0.03; // gravity
      p.rotation += p.rotationSpeed;
      p.life += 1;
    });
    confettiPieces = confettiPieces.filter(p => p.life < p.maxLife && p.y < confettiCanvas.height + 40);
    drawConfetti();
    if (confettiPieces.length > 0) {
      confettiRAF = requestAnimationFrame(stepConfetti);
    } else {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiRAF = null;
    }
  }

  function fireConfetti() {
    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    const count = window.innerWidth < 480 ? 90 : 160;
    confettiPieces = spawnConfetti(count);
    stepConfetti();
    // A second burst shortly after for a fuller effect
    setTimeout(() => {
      confettiPieces = confettiPieces.concat(spawnConfetti(Math.round(count * 0.6)));
      if (!confettiRAF) stepConfetti();
    }, 300);
  }

  function showReveal() {
    revealOverlay.classList.add('reveal-visible');
    fireConfetti();
  }
})();
</script>
</body>
</html>
